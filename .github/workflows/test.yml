name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 24.18.0 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install ripgrep on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Run tests
        run: npm test
