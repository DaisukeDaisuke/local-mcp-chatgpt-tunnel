# Merge this table into config/gateway.toml; replace all example paths first.
# Repeat --repository=OWNER/REPO to allow additional creation/edit destinations.
# The token file is UTF-8 and outside allowed_directories; never put a token in args.
[mcp_servers.gh_pr]
command = 'C:\Program Files\nodejs\node.exe'
args = ['C:\tools\local-mcp-chatgpt-tunnel\mcp\gh-pr\server.mjs', '--repository=ZevyaDev/dqix-decomp', '--token-file=C:\mcp-secrets\github-token.txt', '--gh-executable=C:\Program Files\GitHub CLI\gh.exe', '--max-body=10K']
cwd = 'C:\work\project'
enabled = true
sandbox = 'onlineworkspace'
codex_executable = 'C:\tools\codex\codex.exe'
prefix = 'gh_pr'
annotation_config = false
tool_timeout_sec = 90
serial_group = 'gh_pr'
allowed_directories = ['C:\work\project']
allowed_files = ['C:\mcp-secrets\github-token.txt', 'C:\Program Files\GitHub CLI\gh.exe']
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = []
