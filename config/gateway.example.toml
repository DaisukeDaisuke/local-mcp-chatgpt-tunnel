private_use_only = true
# Publishes gateway__list_available_tools. It reads only the gateway's existing in-memory tool registry.
publish_tool_directory = false
tool_annotations_path = "tool-annotations.toml"

# safe-files uses cwd as its workspace root. The server script path must therefore be absolute.
[mcp_servers.files]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\safe-files\server.mjs']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = true
prefix = "files"
annotation_config = false
startup_timeout_sec = 30
tool_timeout_sec = 1800
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = ['**.ssh**']

# Safe Git operations. Disabled by default; set enabled=true after replacing paths.
# --disable-push=true removes the push tool entirely.
# --disable-pull=true removes the pull tool entirely.
# --disable-clone=true removes clone_repository entirely. Set it to false to enable clone.
[mcp_servers.git]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\gitmcp\server.mjs', '--disable-push=false', '--disable-pull=true', '--disable-clone=true']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = false
prefix = "git"
annotation_config = false
startup_timeout_sec = 60
tool_timeout_sec = 1800
serial_group = "git"
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
# Deny secrets or private subtrees even when they are inside allowed_directories.
disallowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT\private']
disallowed_files = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT\.env']
disallowed_path_globs = ['**.ssh**']

# Read-only GitHub Actions workflow inspection for an explicit repository allowlist.
# The MCP never invokes a shell and does not expose dispatch, rerun, cancel, delete, or download commands.
# Repeat --repository=OWNER/REPO to allow multiple repositories. No other repository can be selected.
# cwd is mandatory here even though every GitHub repository argument is allowlisted by --repository.
[mcp_servers.gh_workflow]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\gh-workflow\server.mjs', '--repository=DaisukeDaisuke/desmume_webassembly']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = false
prefix = "gh_workflow"
annotation_config = false
startup_timeout_sec = 30
tool_timeout_sec = 1800
serial_group = "gh_workflow"
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = ['**.ssh**']

# Read-only image transfer for ChatGPT vision. Enable it only after replacing every dummy path.
[mcp_servers.images]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\safe-images\server.mjs']
cwd = 'C:\Users\owner\Downloads'
enabled = false
prefix = "images"
annotation_config = false
startup_timeout_sec = 30
tool_timeout_sec = 120
allowed_directories = ['C:\Users\owner\Downloads']
allowed_files = []
disallowed_path_globs = ['**.ssh**']

[mcp_servers.images.env]
SAFE_IMAGES_MAX_BYTES = "8388608"
SAFE_IMAGES_MAX_PIXELS = "52428800"

# Read-only ZIP download. Keep this disabled until its cwd and allowlist are replaced with a dedicated source-export root.
[mcp_servers.downloads]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\safe-download\server.mjs']
cwd = 'C:\ABSOLUTE\PATH\TO\DOWNLOADABLE\SOURCE'
enabled = false
prefix = "downloads"
annotation_config = false
startup_timeout_sec = 30
tool_timeout_sec = 300
allowed_directories = ['C:\ABSOLUTE\PATH\TO\DOWNLOADABLE\SOURCE']
allowed_files = []
disallowed_path_globs = ['**.ssh**']

[mcp_servers.downloads.env]
SAFE_DOWNLOAD_MAX_FILES = "500"
SAFE_DOWNLOAD_MAX_INPUT_BYTES = "16777216"
SAFE_DOWNLOAD_MAX_ZIP_BYTES = "20971520"
SAFE_DOWNLOAD_MAX_RG_OUTPUT_BYTES = "8388608"

# Add any other stdio MCP in the same Codex-style shape.
# Path-looking tool arguments are denied unless they match allowed_directories
# or allowed_files. Directory entries include descendants. File entries are exact.
# `enabled = false` keeps an entry without starting it.
# Tool exclusion is per MCP server. `blocked_tools` is an exact-name list.
# `blocked_tool_substrings` is a case-insensitive literal substring list; it is
# not glob or regular-expression syntax. Multiple values are allowed. Setting
# `blocked_tool_substrings = ["script"]` hides every original tool name that
# contains script, including evaluate_script, runScript, and SCRIPT_debug.
# On every gateway initialize, INFO logs list each disabled tool on its own line,
# then report the discovered, disabled, and actually published totals.
#
# [mcp_servers.my_server]
# command = "py"
# args = ['C:\path\to\server.py']
# cwd = 'C:\path\to'
# enabled = false
# prefix = "my_server"
# annotation_config = true
# startup_timeout_sec = 30
# tool_timeout_sec = 1800
# blocked_tools = ["dangerous_tool"]
# blocked_tool_substrings = ["script", "shell", "execute"]
# allowed_directories = ['C:\work\project']
# allowed_files = ['C:\Users\owner\Downloads\one-upload-file.png']
# disallowed_directories = ['C:\work\project\private']
# disallowed_files = ['C:\work\project\.env']
# disallowed_path_globs = ['**.ssh**']
#
# [mcp_servers.my_server.env]
# EXAMPLE_CONFIG = 'C:\path\to\config.json'
