private_use_only = true
# Default false in Gateway code. The example enables Gateway app/*.mjs write protection for safe-files and for any child later moved into a Codex sandbox; sandbox="never" is not an OS write boundary.
protect_gateway_app = true
# Default false. When true, only [gateway] INFO lines are appended to logs/<startup-datetime>_pid-<pid>.txt.
enable-logging-files = false
# Publishes gateway__list_available_tools and gateway__get_prefix_list. They read only the gateway's existing in-memory tool registry.
publish_tool_directory = true
tool_annotations_path = "tool-annotations.toml"

# Every started child MCP also receives <prefix>__get_gateway_access_scope.
# It reports the gateway's current relative-path base and configured/effective path policy.
# Bundled MCP tools require a unique isolatedId created with isolated__create.
# isolated__create accepts one or more absolute workspaces and intersects them with each MCP allowlist.
# Gateway-signed roots cannot be replaced by public root, roots, workspace, or workspaces arguments.

# safe-files uses cwd as its workspace root. The server script path must therefore be absolute.
[mcp_servers.files]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\safe-files\server.mjs']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = true
prefix = "files"
annotation_config = false
# Default false. Only path arguments are canonicalized, then reads and edits of the loaded gateway config are denied.
# This is not an OS sandbox; a child MCP process can still ignore the path policy internally.
dangerous_allow_gateway_config_access = false
startup_timeout_sec = 30
tool_timeout_sec = 1800
# Add every directory that an isolated workspace may select; each isolatedId receives only its requested subset.
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = ['**.ssh**']

# Local Git filesystem operations only. index staging, commit, push, pull, and clone are separate MCP processes below.
# This separation lets each capability choose its own sandbox boundary and keeps signing/network powers out of gitmcp.
# Branch deletion and forced worktree removal are not exposed.
[mcp_servers.git]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\gitmcp\server.mjs', '--git-executable=C:\Program Files\Git\cmd\git.exe']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = false
prefix = "git"
annotation_config = false
dangerous_allow_gateway_config_access = false
startup_timeout_sec = 60
tool_timeout_sec = 1800
serial_group = "git"
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
# Deny secrets or private subtrees even when they are inside allowed_directories.
disallowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT\private']
disallowed_files = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT\.env']
disallowed_path_globs = ['**.ssh**']

# Index staging is separated because git add/restore writes .git/index and .git/index.lock.
[mcp_servers.git_stage]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\git-capability\server.mjs', '--mode=stage', '--git-executable=C:\Program Files\Git\cmd\git.exe']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = false
prefix = "git_stage"
annotation_config = false
serial_group = "git"
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
disallowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT\private']
disallowed_files = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT\.env']
disallowed_path_globs = ['**.ssh**']

# Commit accepts only a literal message; repository selection comes from the signed isolated workspace/base.
[mcp_servers.git_commit]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\git-capability\server.mjs', '--mode=commit', '--git-executable=C:\Program Files\Git\cmd\git.exe']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = false
prefix = "git_commit"
annotation_config = false
serial_group = "git"
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = ['**.ssh**']

