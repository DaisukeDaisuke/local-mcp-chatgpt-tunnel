# GitHub Actions inspection and explicit run cancellation for a repository allowlist.
# The MCP never invokes a shell and does not expose dispatch, rerun, delete, artifact download, or arbitrary gh commands.
# Repeat --repository=OWNER/REPO to allow multiple repositories. No other repository can be selected.
# cwd is mandatory here even though every GitHub repository argument is allowlisted by --repository.
[mcp_servers.gh_workflow]
command = "node"
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\gh-workflow\server.mjs', '--repository=DaisukeDaisuke/desmume_webassembly', '--token-file=C:\ABSOLUTE\PATH\TO\github-token.txt']
