args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\codex-script\server.mjs', '--mode=run', '--runtime=mjs', '--runtime-executable=C:\ABSOLUTE\PATH\TO\node.exe']
cwd = 'C:\ABSOLUTE\PATH\TO\YOUR\PROJECT'
enabled = false
sandbox = "elevated"
codex_executable = 'C:\ABSOLUTE\PATH\TO\codex.exe'
prefix = "mjs_script"
annotation_config = false
dangerous_allow_gateway_config_access = false
startup_timeout_sec = 30
tool_timeout_sec = 660
allowed_directories = ['C:\ABSOLUTE\PATH\TO\YOUR\PROJECT']
allowed_files = []
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = []

