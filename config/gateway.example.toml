# Add any other stdio MCP in the same Codex-style shape.
# Path-looking tool arguments are denied unless they match allowed_directories
# or allowed_files. Directory entries include descendants. File entries are exact.
# `enabled = false` keeps an entry without starting it.
# `sandbox = "elevated"` or `sandbox = "unelevated"` starts that MCP through Codex app-server workspaceWrite sandbox.
# `sandbox = "never"` keeps the old direct stdio behavior. Do not enable arbitrary script runners with sandbox="never".
# Sandboxed MCPs require absolute native executable paths. The gateway does not call where.exe or search PATH.
# `codex_executable` must be the native Codex executable itself (codex.exe on Windows), not a .cmd/.bat shim.
# The sandbox automatically grants read-only access to the selected MCP/runtime executable directory and known interpreter entry-script directory.
# Codex and runtime/MCP executable files must stay outside allowed_directories so workspaceWrite cannot modify them.
# A workspaceWrite sandbox cannot represent deny holes inside a writable root. When sandbox is enabled,
# keep disallowed_directories, disallowed_files, and disallowed_path_globs empty; narrow or split allowed_directories instead.
# Tool exclusion is per MCP server. `blocked_tools` is an exact-name list.
# `blocked_tool_substrings` is a case-insensitive literal substring list; it is
# not glob or regular-expression syntax. Multiple values are allowed. Setting
# `blocked_tool_substrings = ["script"]` hides every original tool name that
# contains script, including evaluate_script, runScript, and SCRIPT_debug.
# On every gateway initialize, INFO logs list each disabled tool on its own line,
# then report the discovered, disabled, and actually published totals.
#
# [mcp_servers.my_server]
# command = "py"
# args = ['C:\path\to\server.py']
# cwd = 'C:\path\to'
# enabled = false
# sandbox = "never"
# codex_executable = 'C:\absolute\path\to\codex.exe'
# sandbox_read_only_directories = ['C:\path\to\mcp-implementation']
# prefix = "my_server"
# annotation_config = true
# dangerous_allow_gateway_config_access = false
# startup_timeout_sec = 30
# tool_timeout_sec = 1800
# blocked_tools = ["dangerous_tool"]
# blocked_tool_substrings = ["script", "shell", "execute"]
# allowed_directories = ['C:\work\project']
# allowed_files = ['C:\Users\owner\Downloads\one-upload-file.png']
# disallowed_directories = ['C:\work\project\private']
# disallowed_files = ['C:\work\project\.env']
# disallowed_path_globs = ['**.ssh**']
#
# [mcp_servers.my_server.env]
# EXAMPLE_CONFIG = 'C:\path\to\config.json'

# Strict allowlisted script runners. Repeat the same bundled MCP with a different --runtime
# to expose independent tools such as mjs_script__run_script, python_script__run_script,
# php_script__run_script, and nodejs_script__run_script.
# These entries must use sandbox="elevated" or sandbox="unelevated" for execution;
# codex-script delegates that setting to a fresh Codex workspaceWrite sandbox for each
# run/check call, using the signed isolation roots as the actual writable roots.
# Arbitrary code cannot safely honor deny holes inside a writable root, so keep
# disallowed_directories, disallowed_files, and disallowed_path_globs empty here;
# narrow or split allowed_directories instead.
[mcp_servers.mjs_script]
