# Fixed sandboxed ARMv5T builder. The preprocessing module and GNU Arm toolchain
# are read-only trust inputs; only BUILD_WORKSPACE is writable. sourcePath and
# outputDirectory passed to build must both be absolute paths inside BUILD_WORKSPACE.
[mcp_servers.buildv5tassembly]
command = 'C:\ABSOLUTE\PATH\TO\node.exe'
args = ['C:\ABSOLUTE\PATH\TO\local-mcp-chatgpt-tunnel\mcp\buildv5tassembly\server.mjs', '--preprocessor-module=C:\ABSOLUTE\PATH\TO\desmume_webassembly_harness\src\armv5t-assembly-preprocessor.js', '--gcc-executable=C:\ABSOLUTE\PATH\TO\GNU-ARM-TOOLCHAIN\bin\arm-none-eabi-gcc.exe', '--objcopy-executable=C:\ABSOLUTE\PATH\TO\GNU-ARM-TOOLCHAIN\bin\arm-none-eabi-objcopy.exe']
cwd = 'C:\ABSOLUTE\PATH\TO\BUILD_WORKSPACE'
enabled = false
sandbox = "elevated"
codex_executable = 'C:\ABSOLUTE\PATH\TO\codex.cmd'
prefix = "buildv5tassembly"
annotation_config = false
dangerous_allow_gateway_config_access = false
startup_timeout_sec = 30
tool_timeout_sec = 660
allowed_directories = ['C:\ABSOLUTE\PATH\TO\BUILD_WORKSPACE', 'C:\Users\owner\AppData\Local\Temp']
sandbox_read_only_directories = ['C:\ABSOLUTE\PATH\TO\desmume_webassembly_harness', 'C:\ABSOLUTE\PATH\TO\GNU-ARM-TOOLCHAIN']
allowed_files = []
disallowed_directories = []
disallowed_files = []
disallowed_path_globs = []
