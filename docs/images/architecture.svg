<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Local MCP ChatGPT Tunnel architecture</title>
  <desc id="desc">ChatGPT Developer Mode connects through OpenAI Secure MCP Tunnel and tunnel-client.exe to the local Node.js Gateway. The Gateway applies tool and path policy, signed isolated workspace contexts for bundled MCPs, and can start each stdio MCP inside a Codex Windows sandbox for an additional OS boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#8b949e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.24"/></filter>
  </defs>
  <rect width="1400" height="860" rx="24" fill="#0d1117"/>
  <text x="700" y="46" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700">ChatGPTからWindows上のstdio MCPへ</text>
  <rect x="38" y="86" width="194" height="108" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#shadow)"/><text x="135" y="130" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">ChatGPT</text><text x="135" y="161" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="15">Developer Mode</text>
  <rect x="282" y="86" width="220" height="108" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="2" filter="url(#shadow)"/><text x="392" y="124" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">OpenAI Secure</text><text x="392" y="151" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">MCP Tunnel</text><text x="392" y="177" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">外向きHTTPS接続</text>
  <rect x="552" y="86" width="220" height="108" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/><text x="662" y="126" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Windows PC</text><text x="662" y="160" text-anchor="middle" fill="#f0f6fc" font-family="Consolas, monospace" font-size="16">tunnel-client.exe</text>
  <rect x="822" y="70" width="540" height="140" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/><text x="1092" y="105" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Node.js Gateway</text><text x="1092" y="135" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">設定検証・stdio集約・&lt;prefix&gt;__&lt;tool&gt; へ名前空間化</text><text x="1092" y="160" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">blocked tools / serial_group / deferred lifecycle / annotations</text><text x="1092" y="185" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">パス引数guard・get_gateway_access_scope・保護設定ファイル</text>
  <line x1="232" y1="140" x2="270" y2="140" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/><line x1="502" y1="140" x2="540" y2="140" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/><line x1="772" y1="140" x2="810" y2="140" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="54" y="270" width="410" height="390" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#shadow)"/><text x="259" y="308" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Gateway側の境界</text>
  <rect x="82" y="334" width="354" height="70" rx="12" fill="#21262d"/><text x="259" y="361" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">全MCP: path allow / deny とツール公開制御</text><text x="259" y="386" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">公開引数をGatewayで検査してから子MCPへ転送</text>
  <rect x="82" y="420" width="354" height="92" rx="12" fill="#21262d"/><text x="259" y="447" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">同梱MCP: isolatedId ごとのWorkspace</text><text x="259" y="472" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">base + roots をHMAC-SHA-256署名</text><text x="259" y="494" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">root/workspace の公開引数による上書きを拒否</text>
  <rect x="82" y="528" width="354" height="104" rx="12" fill="#21262d"/><text x="259" y="555" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">同梱MCP自身も境界を再検証</text><text x="259" y="580" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">実在パス・symlink・deny glob・形式・サイズ等を検証</text><text x="259" y="603" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">子プロセスへGateway署名鍵を引き継がない</text>
  <rect x="506" y="270" width="378" height="390" rx="18" fill="#161b22" stroke="#d29922" stroke-width="2" filter="url(#shadow)"/><text x="695" y="308" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">MCPごとの起動経路</text>
  <rect x="536" y="337" width="318" height="174" rx="14" fill="#21262d" stroke="#d29922" stroke-width="2"/><text x="695" y="369" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Codex Windows sandbox</text><text x="695" y="397" text-anchor="middle" fill="#d29922" font-family="Consolas, monospace" font-size="14">sandbox = "elevated" / "unelevated"</text><text x="695" y="426" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">子MCPプロセス自体をOSサンドボックス内で起動</text><text x="695" y="449" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">allowed_directoriesをworkspaceWrite境界へ反映</text><text x="695" y="472" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">Codex / MCP実行ファイルは書込root外へ配置</text><text x="695" y="495" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">追加のOSレベル防御層（推奨）</text>
  <rect x="536" y="535" width="318" height="94" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 5"/><text x="695" y="566" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Direct stdio</text><text x="695" y="592" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="14">sandbox = "never"</text><text x="695" y="615" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">Codex OS境界なし・従来互換</text><line x1="464" y1="465" x2="494" y2="465" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="926" y="250" width="420" height="430" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="2" filter="url(#shadow)"/><text x="1136" y="286" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">同梱MCP / 任意stdio MCP</text><text x="1136" y="310" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">各 [mcp_servers.*] が独立したsandbox境界を選択</text>
  <rect x="950" y="330" width="176" height="54" rx="12" fill="#21262d"/><text x="1038" y="352" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">safe-files</text><text x="1038" y="372" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">検索・読書き・patch</text>
  <rect x="1146" y="330" width="176" height="54" rx="12" fill="#21262d"/><text x="1234" y="352" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">safe-images</text><text x="1234" y="372" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">PNG / JPEG / WebP</text>
  <rect x="950" y="396" width="176" height="54" rx="12" fill="#21262d"/><text x="1038" y="418" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">safe-download</text><text x="1038" y="438" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">限定ソースをZIP化</text>
  <rect x="1146" y="396" width="176" height="54" rx="12" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/><text x="1234" y="418" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">gitmcp</text><text x="1234" y="438" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, sans-serif" font-size="11">local Gitのみ / sandbox推奨</text>
  <rect x="950" y="462" width="176" height="54" rx="12" fill="#21262d" stroke="#d29922" stroke-width="1.5"/><text x="1038" y="484" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">git_commit</text><text x="1038" y="504" text-anchor="middle" fill="#d29922" font-family="Segoe UI, sans-serif" font-size="11">commitだけ / 独立境界</text>
  <rect x="1146" y="462" width="176" height="54" rx="12" fill="#21262d" stroke="#d29922" stroke-width="1.5"/><text x="1234" y="484" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">git_push</text><text x="1234" y="504" text-anchor="middle" fill="#d29922" font-family="Segoe UI, sans-serif" font-size="11">pushだけ / network権限</text>
  <rect x="950" y="528" width="176" height="54" rx="12" fill="#21262d" stroke="#d29922" stroke-width="1.5"/><text x="1038" y="550" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">git_pull</text><text x="1038" y="570" text-anchor="middle" fill="#d29922" font-family="Segoe UI, sans-serif" font-size="11">fetch + ff-only merge</text>
  <rect x="1146" y="528" width="176" height="54" rx="12" fill="#21262d" stroke="#d29922" stroke-width="1.5"/><text x="1234" y="550" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">git_clone</text><text x="1234" y="570" text-anchor="middle" fill="#d29922" font-family="Segoe UI, sans-serif" font-size="11">cloneだけ / 新規dir作成</text>
  <rect x="950" y="594" width="176" height="54" rx="12" fill="#21262d"/><text x="1038" y="616" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">gh-workflow</text><text x="1038" y="636" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Actions確認 / cancel</text>
  <rect x="1146" y="594" width="176" height="54" rx="12" fill="#21262d" stroke="#d29922" stroke-width="1.5"/><text x="1234" y="614" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">codex-script</text><text x="1234" y="632" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10">mjs/node/python/php</text><text x="1234" y="644" text-anchor="middle" fill="#d29922" font-family="Segoe UI, sans-serif" font-size="9">sandbox必須</text>
  <text x="1136" y="669" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">git-capabilityは --mode=stage|commit|push|pull|clone で用途別に分離</text><line x1="884" y1="405" x2="914" y2="405" stroke="#d29922" stroke-width="3" marker-end="url(#arrow)"/><line x1="884" y1="582" x2="914" y2="582" stroke="#8b949e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="54" y="710" width="1292" height="108" rx="16" fill="#161b22" stroke="#30363d"/><text x="700" y="742" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">境界強化は defense in depth</text><text x="700" y="769" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">Gatewayの引数guard + 同梱MCP内部の実パス検証 + 選択時のCodex OS sandboxを重ねる。sandboxはallow/deny設定の代替ではない。</text><text x="700" y="795" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">codex-scriptは固定runtime・literal argv・shellなし・環境注入なし・stdin閉鎖・timeout/output上限付きで、elevated/unelevated sandboxなしでは起動不可。</text>
</svg>
