<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Local MCP ChatGPT Tunnel architecture</title>
  <desc id="desc">ChatGPT Developer Mode connects through OpenAI Secure MCP Tunnel and tunnel-client.exe to a Node.js gateway that routes requests to local stdio MCP servers on Windows.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#8b949e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="580" rx="24" fill="#0d1117"/>
  <text x="600" y="52" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">ChatGPTからWindows上のstdio MCPへ</text>
  <rect x="44" y="134" width="210" height="126" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="149" y="184" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">ChatGPT</text>
  <text x="149" y="218" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="16">Developer Mode</text>
  <rect x="322" y="134" width="242" height="126" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="443" y="180" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">OpenAI Secure</text>
  <text x="443" y="210" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">MCP Tunnel</text>
  <text x="443" y="238" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="15">外向きHTTPS接続</text>
  <rect x="632" y="106" width="250" height="182" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/>
  <text x="757" y="150" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">Windows PC</text>
  <rect x="660" y="170" width="194" height="42" rx="10" fill="#21262d"/>
  <text x="757" y="197" text-anchor="middle" fill="#f0f6fc" font-family="Consolas, monospace" font-size="16">tunnel-client.exe</text>
  <rect x="660" y="226" width="194" height="42" rx="10" fill="#21262d"/>
  <text x="757" y="253" text-anchor="middle" fill="#f0f6fc" font-family="Consolas, monospace" font-size="16">Node.js Gateway</text>
  <rect x="950" y="62" width="206" height="72" rx="16" fill="#161b22" stroke="#d29922" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053" y="94" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">safe-files</text>
  <text x="1053" y="117" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">検索・読み書き・patch</text>
  <rect x="950" y="154" width="206" height="72" rx="16" fill="#161b22" stroke="#d29922" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053" y="186" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">safe-images</text>
  <text x="1053" y="209" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">PNG・JPEG・WebP</text>
  <rect x="950" y="246" width="206" height="72" rx="16" fill="#161b22" stroke="#d29922" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053" y="278" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">safe-download</text>
  <text x="1053" y="301" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">ソースをZIPで転送</text>
  <rect x="950" y="338" width="206" height="72" rx="16" fill="#161b22" stroke="#d29922" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053" y="370" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">任意のstdio MCP</text>
  <text x="1053" y="393" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14">利用者が設定へ追加</text>
  <line x1="254" y1="197" x2="310" y2="197" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="564" y1="197" x2="620" y2="197" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="882" y1="197" x2="928" y2="98" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="882" y1="197" x2="928" y2="190" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="882" y1="197" x2="928" y2="282" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="882" y1="197" x2="928" y2="374" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="92" y="474" width="1016" height="66" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="502" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Gatewayで制御するもの</text>
  <text x="600" y="527" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="15">ツール名の名前空間化・公開ツール除外・パス許可・直列実行・遅延起動</text>
</svg>